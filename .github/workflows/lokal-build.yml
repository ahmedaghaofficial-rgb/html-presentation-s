name: Syntax Deck / LOKAL build verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/lokal-case-study-syntax]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated LOKAL presentation
        run: |
          test -f dist/lokal.html || test -f dist/lokal/index.html
